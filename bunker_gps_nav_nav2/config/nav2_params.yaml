controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.1221730476
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.6
      lookahead_dist: 0.9
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 1.0
      allow_reversing: false
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.3
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_rate_controller_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: true
      width: 60
      height: 60
      resolution: 0.15
      transform_tolerance: 0.3
      track_unknown_space: false
      footprint: '[[0.65,0.45],[0.65,-0.45],[-0.65,-0.45],[-0.65,0.45]]'
      footprint_padding: 0.05
      plugins:
      - voxel_layer
      - inflation_layer
      always_send_full_costmap: true
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: -0.3
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 0.6
        mark_threshold: 0
        observation_sources: cloud
        cloud:
          topic: /navigation/obstacles
          sensor_frame: os_lidar
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.3
          max_obstacle_height: 0.6
          obstacle_min_range: 0.3
          obstacle_max_range: 28.0
          raytrace_min_range: 0.3
          raytrace_max_range: 29.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.5
        cost_scaling_factor: 3.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 1.0
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      transform_tolerance: 0.3
      track_unknown_space: false
      footprint: '[[0.65,0.45],[0.65,-0.45],[-0.65,-0.45],[-0.65,0.45]]'
      footprint_padding: 0.05
      plugins:
      - voxel_layer
      - inflation_layer
      always_send_full_costmap: true
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: -0.3
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 0.6
        mark_threshold: 0
        observation_sources: cloud
        cloud:
          topic: /navigation/obstacles
          sensor_frame: os_lidar
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.25
          max_obstacle_height: 0.6
          obstacle_min_range: 0.3
          obstacle_max_range: 9.0
          raytrace_min_range: 0.3
          raytrace_max_range: 10.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.5
        cost_scaling_factor: 3.0
